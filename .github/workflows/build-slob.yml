name: Build Slob from MediaWiki

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag'
        required: true
      recent_days:
        description: 'Days to look back for incremental scrape'
        type: number
        default: 7

env:
  COUCHDB_USER: admin
  COUCHDB_PASSWORD: password

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: wiki.archlinux.org
            site_path: /
          - site: wiki.gentoo.org
            site_path: /
          - site: wiki.puella-magi.net
            site_path: /w/

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-icu python3-venv git curl apt-transport-https gnupg python3-lxml

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-slob-${{ runner.os }}-v1

      - name: Create Python venv and install deps
        run: |
          python3 -m venv env-slob --system-site-packages
          source env-slob/bin/activate
          pip install git+https://github.com/itkach/slob.git
          pip install https://github.com/itkach/mwscrape/tarball/master
          pip install git+https://github.com/itkach/mw2slob.git

      - name: Install CouchDB
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          curl https://couchdb.apache.org/repo/keys.asc | gpg --dearmor | sudo tee /usr/share/keyrings/couchdb-archive-keyring.gpg >/dev/null 2>&1
          source /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/couchdb-archive-keyring.gpg] https://apache.jfrog.io/artifactory/couchdb-deb/ ${VERSION_CODENAME} main" | sudo tee /etc/apt/sources.list.d/couchdb.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y couchdb

      - name: Restore CouchDB data cache
        uses: actions/cache@v4
        id: cache-couchdb
        with:
          path: /opt/couchdb/data
          key: couchdb-${{ matrix.site }}-${{ github.run_id }}
          restore-keys: |
            couchdb-${{ matrix.site }}-

      - name: Fix CouchDB data ownership
        run: |
          sudo chown -R couchdb:couchdb /opt/couchdb/data
          sudo chmod -R 770 /opt/couchdb/data

      - name: Start CouchDB
        run: sudo COUCHDB_USER=${{ env.COUCHDB_USER }} COUCHDB_PASSWORD=${{ env.COUCHDB_PASSWORD }} /opt/couchdb/bin/couchdb &

      - name: Wait for CouchDB
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://${{ env.COUCHDB_USER }}:${{ env.COUCHDB_PASSWORD }}@localhost:5984/_up | grep -q '"ok":true'; then
              echo "CouchDB is up"
              exit 0
            fi
            sleep 2
          done
          echo "CouchDB failed to start"
          exit 1

      - name: Scrape site
        run: |
          source env-slob/bin/activate
          SCRAPE_ARGS=(-c http://${{ env.COUCHDB_USER }}:${{ env.COUCHDB_PASSWORD }}@localhost:5984 --site-path="${{ matrix.site_path }}")
          if [[ "${{ steps.cache-couchdb.outputs.cache-hit }}" == "true" ]]; then
            echo "Cache hit — performing incremental scrape"
            SCRAPE_ARGS+=(--recent --recent-days ${{ inputs.recent_days }})
          else
            echo "No cache — performing full scrape"
          fi
          mwscrape "${SCRAPE_ARGS[@]}" "${{ matrix.site }}"

      - name: Build slob
        run: |
          source env-slob/bin/activate
          SITE_NAME=$(sed 's/\./-/g' <<< "${{ matrix.site }}")
          mw2slob scrape http://${{ env.COUCHDB_USER }}:${{ env.COUCHDB_PASSWORD }}@127.0.0.1:5984/$SITE_NAME --ensure-ext-image-urls

      - name: Prepare CouchDB data for cache
        if: always()
        run: sudo chown -R $USER /opt/couchdb/data

      - name: Upload slob artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.site }}.slob
          path: ./*.slob

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: artifacts/*.slob
